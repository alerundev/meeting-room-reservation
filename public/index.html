<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회의실 예약</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar"><div class="shell"><div class="brand"><span class="brand-mark">⌂</span><span>워크스페이스</span></div><span class="status">● 예약센터</span></div></header>
  <main class="shell">
    <section class="hero"><div><p class="eyebrow">MEETING ROOM BOOKING</p><h1>회의실을 간편하게<br /><em>예약하세요.</em></h1><p class="hero-copy">팀의 집중을 위한 공간을 한눈에 확인하고, 필요한 시간만 빠르게 예약할 수 있습니다.</p></div><div class="hero-art" aria-hidden="true"><span>✦</span><span>◒</span><span>▦</span></div></section>
    <div id="notice" class="notice" hidden></div>
    <section class="layout">
      <div class="primary">
        <div class="section-heading"><div><p class="eyebrow">YOUR SCHEDULE</p><h2>예약 일정</h2></div><label class="date-picker">날짜 선택 <input id="dateFilter" type="date" /></label></div>
        <div id="reservationList" class="reservation-list"><div class="empty">예약을 불러오는 중입니다...</div></div>
      </div>
      <aside class="booking-card"><div class="card-heading"><span class="icon">＋</span><div><p class="eyebrow">NEW BOOKING</p><h2>새 예약</h2></div></div>
        <form id="bookingForm">
          <label>회의실<select id="roomId" name="roomId" required><option value="">회의실 선택</option></select></label>
          <div class="two-col"><label>예약자명<input name="reserverName" placeholder="홍길동" required maxlength="100" /></label><label>이메일<input name="email" type="email" placeholder="you@company.com" required maxlength="254" /></label></div>
          <label>예약 제목<input name="title" placeholder="예: 주간 팀 미팅" required maxlength="200" /></label>
          <div class="two-col"><label>시작일시<input name="startAt" type="datetime-local" required /></label><label>종료일시<input name="endAt" type="datetime-local" required /></label></div>
          <p class="form-hint">※ 예약 시간은 겹칠 수 없으며, 종료 시각은 시작 시각보다 늦어야 합니다.</p>
          <button type="submit" class="primary-button">예약하기 <span>→</span></button>
        </form>
      </aside>
    </section>
  </main>
  <footer><div class="shell">워크스페이스 예약센터 <span>·</span> 함께 쓰는 공간을 더 편리하게</div></footer>
  <script src="/app.js"></script>
</body>
</html>
