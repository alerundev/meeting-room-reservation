<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 회의실 예약 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

  <!-- Navigation Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
          <i class="fa-solid fa-calendar-check text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 tracking-tight">RoomBooker</h1>
          <p class="text-xs text-slate-500 font-medium">스마트 사내 회의실 예약 시스템</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <button id="btn-open-room-modal" class="inline-flex items-center space-x-1.5 px-3 py-2 text-sm font-medium rounded-lg text-slate-700 bg-slate-100 hover:bg-slate-200 transition">
          <i class="fa-solid fa-door-open text-slate-500"></i>
          <span>회의실 추가</span>
        </button>
        <button id="btn-open-reserve-modal" class="inline-flex items-center space-x-1.5 px-4 py-2 text-sm font-semibold rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 transition shadow-sm shadow-indigo-200">
          <i class="fa-solid fa-plus"></i>
          <span>새 예약 등록</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-6">

    <!-- Top Toolbar: Date picker & View controls -->
    <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/80 shadow-sm flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
      
      <!-- Date Navigation -->
      <div class="flex items-center space-x-2">
        <button id="btn-prev-day" class="p-2.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-indigo-600 transition" title="이전 날짜">
          <i class="fa-solid fa-chevron-left text-sm"></i>
        </button>
        <button id="btn-today" class="px-3.5 py-2 rounded-lg border border-slate-200 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition">
          오늘
        </button>
        <button id="btn-next-day" class="p-2.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-indigo-600 transition" title="다음 날짜">
          <i class="fa-solid fa-chevron-right text-sm"></i>
        </button>
        
        <div class="relative ml-2">
          <input type="date" id="current-date-input" class="pl-9 pr-3 py-2 text-sm font-medium border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm cursor-pointer">
          <i class="fa-regular fa-calendar absolute left-3 top-2.5 text-slate-400 pointer-events-none text-sm"></i>
        </div>
        <span id="display-date-str" class="text-sm font-semibold text-slate-600 hidden sm:inline ml-2"></span>
      </div>

      <!-- Filters & Room Selection -->
      <div class="flex flex-wrap items-center gap-3">
        <div class="flex items-center space-x-1.5">
          <label for="room-filter" class="text-xs font-semibold text-slate-500">회의실:</label>
          <select id="room-filter" class="text-sm border border-slate-300 rounded-lg py-2 px-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white shadow-sm font-medium">
            <option value="all">전체 회의실</option>
          </select>
        </div>

        <!-- View switcher tab -->
        <div class="inline-flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs font-medium">
          <button id="view-timeline-btn" class="px-3 py-1.5 rounded-md bg-white text-indigo-700 font-semibold shadow-xs transition">
            <i class="fa-solid fa-table-columns mr-1"></i>타임테이블
          </button>
          <button id="view-list-btn" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition">
            <i class="fa-solid fa-list mr-1"></i>목록 뷰
          </button>
          <button id="view-my-btn" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition">
            <i class="fa-solid fa-user-clock mr-1"></i>내 예약
          </button>
        </div>
      </div>
    </div>

    <!-- Alert / Toast Container -->
    <div id="alert-banner" class="hidden transition duration-300 ease-in-out"></div>

    <!-- SECTION 1: Timetable / Timeline View -->
    <section id="section-timeline" class="space-y-4">
      <!-- Room Summary Cards -->
      <div id="room-summary-cards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
        <!-- Injected via JS -->
      </div>

      <!-- Schedule Board -->
      <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
        <div class="p-4 sm:p-5 border-b border-slate-100 flex items-center justify-between">
          <h2 class="font-bold text-slate-900 flex items-center gap-2 text-base">
            <i class="fa-solid fa-clock text-indigo-500"></i>
            회의실별 실시간 타임테이블
          </h2>
          <span class="text-xs text-slate-500">운영 시간: 08:00 ~ 20:00 (1시간 단위)</span>
        </div>

        <div class="overflow-x-auto">
          <div class="min-w-[760px] p-4 sm:p-6" id="timetable-wrapper">
            <!-- Timetable dynamic content -->
          </div>
        </div>
      </div>
    </section>

    <!-- SECTION 2: List View -->
    <section id="section-list" class="hidden space-y-4">
      <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
        <div class="p-4 sm:p-5 border-b border-slate-100 flex items-center justify-between">
          <h2 class="font-bold text-slate-900 flex items-center gap-2 text-base">
            <i class="fa-solid fa-list-check text-indigo-500"></i>
            선택된 날짜의 모든 예약
          </h2>
          <span id="list-count-badge" class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-1 rounded-full">0건</span>
        </div>

        <div id="reservations-list-container" class="divide-y divide-slate-100">
          <!-- Injected via JS -->
        </div>
      </div>
    </section>

    <!-- SECTION 3: My Reservations View -->
    <section id="section-my" class="hidden space-y-4">
      <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
        <div class="p-4 sm:p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="font-bold text-slate-900 flex items-center gap-2 text-base">
              <i class="fa-solid fa-id-card-clip text-indigo-500"></i>
              내 예약 내역 확인 및 간편 취소
            </h2>
            <p class="text-xs text-slate-500 mt-0.5">예약자명으로 본인이 예약한 목록을 검색하고 손쉽게 취소할 수 있습니다.</p>
          </div>
          <div class="flex items-center space-x-2">
            <input type="text" id="my-name-filter" placeholder="예약자명 입력 (예: 홍길동)" class="text-sm border border-slate-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-indigo-500">
            <button id="btn-search-my" class="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-semibold hover:bg-slate-700">검색</button>
          </div>
        </div>

        <div id="my-reservations-container" class="divide-y divide-slate-100">
          <!-- Injected via JS -->
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL 1: 새 예약 생성 모달 -->
  <div id="modal-reserve" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl border border-slate-100 overflow-hidden transform transition-all animate-in fade-in zoom-in duration-150">
      
      <div class="px-6 py-4 bg-gradient-to-r from-indigo-600 to-indigo-700 text-white flex items-center justify-between">
        <h3 class="font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-calendar-plus"></i>
          회의실 예약하기
        </h3>
        <button id="btn-close-reserve-modal" class="text-indigo-200 hover:text-white text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="form-reserve" class="p-6 space-y-4">
        <!-- Error / Conflict message within modal -->
        <div id="reserve-modal-error" class="hidden p-3 rounded-lg bg-red-50 text-red-700 text-xs font-medium border border-red-200 flex items-start gap-2">
          <i class="fa-solid fa-circle-exclamation text-red-500 mt-0.5"></i>
          <span id="reserve-modal-error-text"></span>
        </div>

        <!-- Room selection -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">회의실 선택 <span class="text-red-500">*</span></label>
          <select id="reserve-room-id" required class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white font-medium">
            <option value="">회의실을 선택하세요</option>
          </select>
        </div>

        <!-- Reservation Title -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">회의 제목 / 목적 <span class="text-red-500">*</span></label>
          <input type="text" id="reserve-title" required placeholder="예: 주간 기획 회의, 스프린트 회고" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Reserver Name -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">예약자명 <span class="text-red-500">*</span></label>
          <input type="text" id="reserve-name" required placeholder="예: 홍길동 (개발팀)" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Date & Time Range -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">예약 일자 <span class="text-red-500">*</span></label>
            <input type="date" id="reserve-date" required class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 font-medium">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">시작 시간 <span class="text-red-500">*</span></label>
            <input type="time" id="reserve-start-time" required step="1800" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 font-medium">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">종료 시간 <span class="text-red-500">*</span></label>
            <input type="time" id="reserve-end-time" required step="1800" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 font-medium">
          </div>
        </div>

        <!-- Memo -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">메모 (선택사항)</label>
          <textarea id="reserve-memo" rows="2" placeholder="필요 장비나 준비물, 비고 등을 적어주세요." class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div class="pt-2 flex items-center justify-end space-x-3">
          <button type="button" id="btn-cancel-reserve" class="px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition">취소</button>
          <button type="submit" id="btn-submit-reserve" class="px-5 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition shadow-md shadow-indigo-200">예약 확정</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 2: 회의실 추가 모달 -->
  <div id="modal-room" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-100 overflow-hidden transform transition-all animate-in">
      
      <div class="px-6 py-4 bg-gradient-to-r from-slate-800 to-slate-900 text-white flex items-center justify-between">
        <h3 class="font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-door-open"></i>
          새 회의실 등록
        </h3>
        <button id="btn-close-room-modal" class="text-slate-400 hover:text-white text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="form-room" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">회의실 이름 <span class="text-red-500">*</span></label>
          <input type="text" id="room-name" required placeholder="예: 혁신룸, 집중토론실" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-slate-800">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">수용 인원 (명) <span class="text-red-500">*</span></label>
            <input type="number" id="room-capacity" required min="1" max="100" value="6" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-slate-800">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">위치 <span class="text-red-500">*</span></label>
            <input type="text" id="room-location" required placeholder="예: 신관 2층 201호" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-slate-800">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">설명 및 장비</label>
          <textarea id="room-desc" rows="2" placeholder="빔프로젝터, 화상회의 장비, 화이트보드 유무 등" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-slate-800"></textarea>
        </div>

        <div class="pt-2 flex items-center justify-end space-x-3">
          <button type="button" id="btn-cancel-room" class="px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition">취소</button>
          <button type="submit" class="px-5 py-2 text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 rounded-lg transition">등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 3: 예약 상세 모달 -->
  <div id="modal-detail" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-sm w-full shadow-2xl border border-slate-100 overflow-hidden transform transition-all">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">예약 상세 정보</span>
        <button id="btn-close-detail-modal" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-5 space-y-3" id="detail-modal-body">
        <!-- Content injected dynamically -->
      </div>
      <div class="p-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
        <button id="btn-delete-from-detail" class="text-xs font-semibold text-red-600 hover:text-red-700 flex items-center gap-1.5 px-3 py-2 rounded-lg hover:bg-red-50 transition">
          <i class="fa-regular fa-trash-can"></i>
          예약 취소
        </button>
        <button id="btn-ok-detail" class="px-4 py-2 text-xs font-semibold bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg transition">닫기</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-slate-200/80 bg-white py-4 text-center text-xs text-slate-400 mt-auto">
    <div class="max-w-7xl mx-auto px-4">
      회의실 예약 시스템 &copy; 2026 RoomBooker. Node.js &amp; PostgreSQL 기반.
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
